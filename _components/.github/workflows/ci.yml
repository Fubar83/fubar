name: CI

# Build + test on every push to main and every pull request. Package publishing lives in
# release.yml (it runs on version tags). Public repos get unlimited free Actions minutes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an in-progress run for a ref when a newer commit is pushed to it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # MinVer derives the version from the nearest tag, so it needs the full history.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Fubar.Controls.slnx

      - name: Build
        run: dotnet build Fubar.Controls.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Fubar.Controls.slnx --configuration Release --no-build --verbosity normal

      # Packing on every run catches packaging breakage (missing readme, bad metadata, a project
      # that accidentally became packable) at PR time rather than at release time.
      - name: Pack
        run: dotnet pack Fubar.Controls.slnx --configuration Release --no-build

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/packages/*
          if-no-files-found: error
