name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! For a wrong diff, the two input files (or a
        minimal cut-down pair) are by far the most useful thing you can attach. Please **do not
        attach files containing real secrets** — a diff tool is often pointed at config files.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
      placeholder: When I ..., I expected ..., but instead ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal, ordered list. Include the two inputs if the diff itself is wrong.
      placeholder: |
        1. Compare these two files: ...
        2. Turn on "Ignore whitespace"
        3. Line 12 is reported as changed when it is identical
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Release version, or the commit SHA if building from source.
    validations:
      required: true
  - type: dropdown
    id: options
    attributes:
      label: Comparison options in use
      multiple: true
      options:
        - None (default)
        - Ignore whitespace
        - Ignore case
        - Normalize JSON/XML
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Stack traces, console output, or a screenshot of the diff pane.
      render: shell
    validations:
      required: false
