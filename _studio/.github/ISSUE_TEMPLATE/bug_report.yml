name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please **do not include real production
        credentials** (tokens, passwords, API keys) in this report.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
      placeholder: When I ..., I expected ..., but instead ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal, ordered list. Attach a sanitized spec/workspace if relevant.
      placeholder: |
        1. Import spec X
        2. Open request Y
        3. Click Send
        4. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Release version, or the commit SHA if building from source.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Anything from the in-app Status & Log strip, stack traces, or screenshots.
      render: shell
    validations:
      required: false
