name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! A minimal repro — ideally a small XAML snippet, or a
        page added to `Fubar.Controls.Gallery` — makes this far easier to fix.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
      placeholder: When I ..., I expected ..., but instead ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal, ordered list. A XAML snippet reproducing the issue helps most.
      placeholder: |
        1. Add <fc:TabStrip ... /> to a window
        2. Drag the second tab past the last one
        3. The drop indicator renders in the wrong place
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Fubar.Controls version
      description: The NuGet package version, or the commit SHA if building from source.
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme variant
      description: Several styling bugs only show in one variant.
      options:
        - Both
        - Dark only
        - Light only
        - Not theme-related
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Stack traces, Avalonia binding errors, or screenshots (before/after helps for visual bugs).
      render: shell
    validations:
      required: false
