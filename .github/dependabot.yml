version: 2
updates:
  # .NET dependencies (Central Package Management: Directory.Packages.props)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # xunit.v3 4.x drops the VSTest `dotnet test` path for Microsoft.Testing.Platform, which needs
      # a test-runner migration this repo has not done - and mixed MTP/VSTest projects cannot run
      # together under one `dotnet test`, so the bump cannot land piecemeal either. Left unignored it
      # reopens a permanently-red PR every week, which is how a red PR list stops meaning anything.
      # Remove this when migrating; see the matching note in Directory.Packages.props.
      - dependency-name: "xunit.v3"
        versions: [">=4.0.0"]
    groups:
      avalonia:
        patterns:
          - "Avalonia*"
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"

  # GitHub Actions used by the workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
