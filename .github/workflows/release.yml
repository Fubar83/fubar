name: release

# Publishes Fubar.Controls to nuget.org. Triggered by a version tag (e.g. v0.1.0) - MinVer reads that
# tag to stamp the package version, so the tag is the single source of truth for the version number.
# Every package gets a Sigstore build-provenance attestation, verifiable with:
#   gh attestation verify <file> --repo Fubar83/fubar-components
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub Release
      id-token: write      # OIDC token for Sigstore signing
      attestations: write  # store the provenance attestation on the repo
    steps:
      - uses: actions/checkout@v7
        with:
          # MinVer needs the tags and full history to compute the version.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Re-run the gate here rather than trusting the CI run on the commit: a tag can be pushed to
      # any commit, and shipping a broken package is not something you can take back.
      - name: Build
        run: dotnet build Fubar.Controls.slnx --configuration Release

      - name: Test
        run: dotnet test Fubar.Controls.slnx --configuration Release --no-build

      - name: Pack
        run: dotnet pack Fubar.Controls.slnx --configuration Release --no-build

      - name: Show package version
        run: ls -l artifacts/packages

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'artifacts/packages/*.nupkg'

      # --skip-duplicate makes a re-run of this workflow idempotent instead of a hard failure.
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY secret is not set - add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/packages/*
          generate_release_notes: true
